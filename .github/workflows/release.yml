name: Release
on:
  push:
    tags:
      - v*
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    name: Push gem to RubyGems
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write # OIDC token for RubyGems trusted publishing and Sigstore attestations
      contents: write # publish the GitHub release via `gh release create`
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: bundle install --jobs 2

      - name: Generate release notes
        run: bin/rake release:notes

      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        with:
          setup-trusted-publisher: true
          attestations: true
          await-release: true

      - name: Publish release to GitHub
        run: |-
          version=$(< pkg/version.txt)
          gh release create \
            "v${version}" \
            "pkg/pg-azure_workload_identity-${version}.gem" \
            "pkg/pg-azure_workload_identity-${version}.gem.sigstore.json" \
            --notes-file pkg/release.md \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
