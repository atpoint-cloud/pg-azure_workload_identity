name: Release
on:
  push:
    tags:
      - v*
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    name: Push gem to RubyGems
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write # OIDC token for RubyGems trusted publishing and Sigstore attestations
      contents: write # publish the GitHub release via `gh release create`
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install gems
        run: bundle install --jobs 2

      - name: Generate release notes
        run: bin/rake release:notes

      - uses: rubygems/release-gem@6317d8d1f7e28c24d28f6eff169ea854948bd9f7 # v1.2.0
        with:
          setup-trusted-publisher: true
          attestations: true
          await-release: true

      - name: Publish release to GitHub
        run: |-
          version=$(< pkg/version.txt)
          gh release create \
            "v${version}" \
            "pkg/pg-azure_workload_identity-${version}.gem" \
            "pkg/pg-azure_workload_identity-${version}.gem.sigstore.json" \
            --notes-file pkg/release.md \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
